<title>SKiBD Kolos 2 — Quiz ABCD</title>
<style>
:root{

  --gold:#e0a200;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);

.wrap{max-width:860px;margin:0 auto;padding:24px 16px 80px}
header{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
h1{font-size:22px;margin:0;letter-spacing:.2px}
.sub{color:var(--muted);font-size:13px}
.bar{position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg),var(--bg) 70%,transparent);
  padding:12px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.progress{flex:1;min-width:160px;height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#7aa7ff);transition:width .3s}
.stat{font-size:13px;color:var(--muted);white-space:nowrap}
.stat b{color:var(--txt)}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--panel2);
  color:var(--txt);padding:8px 12px;border-radius:9px;font-size:14px;user-select:none}
.toggle:hover{border-color:var(--accent);background:#222a36}
.toggle input{accent-color:var(--accent);width:16px;height:16px;margin:0}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--panel2);
  color:var(--txt);padding:8px 14px;border-radius:9px;transition:.15s}
button:hover{border-color:var(--accent);background:#222a36}
button.primary{background:var(--accent2);border-color:var(--accent2)}
button.primary:hover{background:var(--accent)}
button:disabled{opacity:.45;cursor:default;border-color:var(--border);background:var(--panel2)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:18px 18px 14px;margin-bottom:14px;scroll-margin-top:80px}
.qhead{display:flex;gap:10px;align-items:baseline;margin-bottom:14px}
.qnum{font-size:12px;font-weight:700;color:#0e1116;background:var(--gold);
  border-radius:6px;padding:2px 8px;flex-shrink:0}
.qtext{font-size:16px;font-weight:600}
.qtext code,.opt code{background:#0c1018;border:1px solid #222b38;border-radius:5px;
  padding:1px 5px;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.88em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;
  background:var(--panel2);border:1px solid var(--border);border-radius:10px;
  padding:11px 13px;width:100%;font-size:14.5px;color:var(--txt)}
.opt:hover:not(.locked){border-color:var(--accent);background:#222a36}
.opt .letter{font-weight:700;color:var(--muted);flex-shrink:0;width:18px}
.opt.correct{background:var(--okbg);border-color:var(--ok)}
.opt.correct .letter{color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt.wrong .letter{color:var(--bad)}
.opt.locked{cursor:default}
.mark{margin-left:auto;font-weight:700;flex-shrink:0}
.mark.ok{color:var(--ok)} .mark.no{color:var(--bad)}
.done{text-align:center;padding:30px 18px;background:var(--panel);border:1px solid var(--border);
  border-radius:14px;margin-bottom:14px}
.done h2{margin:.2em 0}
.score{font-size:40px;font-weight:800}
.hidden{display:none}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:4px}
.nav .navpos{color:var(--muted);font-size:13px;white-space:nowrap}
.nav .navpos b{color:var(--txt)}
.nav button{min-width:120px}
.nav button:disabled{opacity:.4;cursor:default;border-color:var(--border);background:var(--panel2)}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}
.summary-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.hint{color:var(--muted);font-size:13px;margin-top:8px}
@media(max-width:520px){.qtext{font-size:15px}.opt{font-size:14px}}

const LETTERS = ['A','B','C','D','E','F'];
const baseOrder = QUESTIONS.map((_,i)=>i);
let order = baseOrder.slice();     // aktualny zestaw pytań: pełny albo tylko błędne
let answered = {};                 // qIndex -> wybrana odpowiedź
let current = 0;                   // obecna pozycja w aktualnym zestawie
let wrongMode = false;             // czy przerabiamy tylko błędne
let randomAnswers = false;          // czy losować kolejność odpowiedzi A-D
let answerOrderMap = {};            // qIndex -> wylosowana kolejność indeksów odpowiedzi

const quizEl = document.getElementById('quiz');
const summaryEl = document.getElementById('summary');
const navEl = document.getElementById('nav');
const retryWrongBtn = document.getElementById('retryWrongBtn');
const modeLabelEl = document.getElementById('modeLabel');
const shuffleAnswersToggle = document.getElementById('shuffleAnswersToggle');

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
// zamien fragmenty kodu (tagi html, php) na <code>
function fmt(s){
  let e = esc(s);
  // owin sekwencje wygladajace na kod/tagi
  e = e.replace(/(&lt;[^&]*?&gt;|\$[A-Za-z_][\w\[\]\$]*|&lt;\?[\s\S]*?\?&gt;|SELECT [\s\S]*$|INSERT [\s\S]*$|UPDATE [\s\S]*$|DELETE [\s\S]*$|CREATE [\s\S]*$|mysql_\w+|echo [^;]*)/g, m=>'<code>'+m+'</code>');
  return e;
}

function hasAnswer(qi){
  return Object.prototype.hasOwnProperty.call(answered, qi);
}

function getAnsweredInActiveSet(){
  return order.filter(qi=>hasAnswer(qi));
}

function getWrongInActiveSet(){
  return order.filter(qi=>hasAnswer(qi) && answered[qi] !== QUESTIONS[qi].correct);
}

function clearSummary(){
  summaryEl.className='hidden';
  summaryEl.innerHTML='';
}

function shuffledCopy(arr){
  const copy = arr.slice();
  for(let i=copy.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  return copy;
}

function clearAnswerOrders(){
  answerOrderMap = {};
}

function getAnswerOrder(qi){
  const base = QUESTIONS[qi].a.map((_,i)=>i);
  if(!randomAnswers) return base;
  if(!answerOrderMap[qi]) answerOrderMap[qi] = shuffledCopy(base);
  return answerOrderMap[qi];
}

function render(){
  if(order.length===0){
    quizEl.innerHTML='<div class="done"><h2>Brak pytań do wyświetlenia.</h2></div>';
    updateStats();
    updateNav();
    return;
  }
  if(current<0) current=0;
  if(current>order.length-1) current=order.length-1;

  const qi = order[current];
  const q = QUESTIONS[qi];
  quizEl.innerHTML='';
  const card = document.createElement('div');
  card.className='card';
  card.id='card-'+qi;
  let opts='';
  getAnswerOrder(qi).forEach((oi,pos)=>{
    const opt = q.a[oi];
    opts += `<button class="opt" data-q="${qi}" data-o="${oi}" data-pos="${pos}">
      <span class="letter">${LETTERS[pos]}</span>
      <span class="otext">${fmt(opt)}</span></button>`;
  });
  card.innerHTML = `
    <div class="qhead">
      <span class="qnum">${current+1}</span>
      <span class="qtext">${fmt(q.q)}</span>
    </div>
    <div class="opts">${opts}</div>`;
  quizEl.appendChild(card);

  // przywróć stan, gdy użytkownik wraca do pytania
  if(hasAnswer(qi)) applyState(qi, answered[qi]);
  bind();
  updateStats();
  updateNav();
}

function updateNav(){
  modeLabelEl.textContent = wrongMode ? 'błędne' : 'pełny';
  document.getElementById('navnum').textContent=order.length ? current+1 : 0;
  document.getElementById('navtot').textContent=order.length;
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===order.length-1 || order.length===0;
}

function go(delta){
  const t = current+delta;
  if(t<0 || t>order.length-1) return;
  current = t;
  render();
}

function bind(){
  document.querySelectorAll('.opt').forEach(b=>{
    b.addEventListener('click',()=>{
      const qi=+b.dataset.q, oi=+b.dataset.o;
      if(hasAnswer(qi)) return; // już odpowiedziano, zablokuj zmianę
      answered[qi]=oi;
      applyState(qi,oi);
      updateStats();
    });
  });
}

function applyState(qi,chosen){
  const q=QUESTIONS[qi];
  const card=document.getElementById('card-'+qi);
  if(!card) return;
  card.querySelectorAll('.opt').forEach(b=>{
    const oi=+b.dataset.o;
    b.classList.add('locked');
    if(oi===q.correct){
      b.classList.add('correct');
      if(!b.querySelector('.mark.ok')) b.insertAdjacentHTML('beforeend','<span class="mark ok">✓</span>');
    }
    if(oi===chosen && chosen!==q.correct){
      b.classList.add('wrong');
      if(!b.querySelector('.mark.no')) b.insertAdjacentHTML('beforeend','<span class="mark no">✗</span>');
    }
  });
}

function updateStats(){
  const total=order.length;
  const answeredList=getAnsweredInActiveSet();
  const ans=answeredList.length;
  let correct=0;
  answeredList.forEach(qi=>{ if(answered[qi]===QUESTIONS[qi].correct) correct++; });
  const wrongQs=getWrongInActiveSet();
  const wrong=wrongQs.length;

  document.getElementById('total').textContent=total;
  document.getElementById('answered').textContent=ans;
  document.getElementById('correct').textContent=correct;
  document.getElementById('wrong').textContent=wrong;
  document.getElementById('pbar').style.width=(total ? ans/total*100 : 0)+'%';

  // przycisk działa tylko wtedy, gdy w aktualnym zestawie są już błędne odpowiedzi
  retryWrongBtn.disabled = wrong===0;

  if(ans===total && total>0) showSummary(correct,total,wrongQs);
  else clearSummary();
}

function showSummary(correct,total,wrongQs){
  const pct=Math.round(correct/total*100);
  const wrong=wrongQs.length;
  let msg = pct>=90?'Świetnie! 🎉':pct>=70?'Dobra robota 👍':pct>=50?'Nieźle, douczaj się 📚':'Powtórz materiał 💪';
  summaryEl.className='done';
  summaryEl.innerHTML=`<div class="score" style="color:${pct>=70?'var(--ok)':pct>=50?'var(--gold)':'var(--bad)'}">${correct}/${total} · ${pct}%</div>
    <h2>${wrongMode ? 'Powtórka błędnych zakończona' : msg}</h2>
    <div class="hint">${wrong ? 'Kliknij „Przerób błędne”, aby uruchomić nowy zestaw tylko z pytaniami, na które odpowiedziałeś źle.' : 'Nie masz błędnych odpowiedzi w tym zestawie.'}</div>
    <div class="summary-actions">
      <button class="primary" data-action="reset-active">Zacznij ten zestaw od nowa</button>
      <button data-action="retry-wrong" ${wrong ? '' : 'disabled'}>↺ Przerób błędne</button>
      <button data-action="full-test">Pełny test</button>
    </div>`;
  summaryEl.scrollIntoView({behavior:'smooth'});
}

function startWrongSet(wrongQs){
  order = wrongQs.slice();
  answered = {};
  clearAnswerOrders();
  current = 0;
  wrongMode = true;
  clearSummary();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function retryWrong(){
  const wrongQs = getWrongInActiveSet();
  if(!wrongQs.length){
    alert('Nie ma błędnych odpowiedzi do przerobienia.');
    return;
  }
  startWrongSet(wrongQs);
}

function shuffle(){
  answered={};
  clearAnswerOrders();
  clearSummary();
  for(let i=order.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [order[i],order[j]]=[order[j],order[i]];
  }
  current=0;
  render();
}

function resetActive(rerender=true){
  answered={};
  clearAnswerOrders();
  current=0;
  clearSummary();
  if(rerender) render();
}

function startFullTest(){
  order=baseOrder.slice();
  wrongMode=false;
  resetActive();
}

function reset(){
  startFullTest();
}

window.reset=reset;
window.resetActive=resetActive;
window.startFullTest=startFullTest;
window.retryWrong=retryWrong;

document.getElementById('retryWrongBtn').addEventListener('click',retryWrong);
document.getElementById('shuffleBtn').addEventListener('click',shuffle);
shuffleAnswersToggle.addEventListener('change',()=>{
  randomAnswers = shuffleAnswersToggle.checked;
  resetActive();
});
document.getElementById('resetBtn').addEventListener('click',reset);
document.getElementById('prevBtn').addEventListener('click',()=>go(-1));
document.getElementById('nextBtn').addEventListener('click',()=>go(1));
summaryEl.addEventListener('click',e=>{
  const btn=e.target.closest('button[data-action]');
  if(!btn) return;
  if(btn.dataset.action==='retry-wrong') retryWrong();
  if(btn.dataset.action==='reset-active') resetActive();
  if(btn.dataset.action==='full-test') startFullTest();
});

// nawigacja strzalkami klawiatury
// cyfry 1-6 wybierają widoczną odpowiedź od góry
// UWAGA: w trybie błędnych strzałki poruszają się tylko po błędnych pytaniach.
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){go(-1);}
  else if(e.key==='ArrowRight'){go(1);}
  else if(/^[1-6]$/.test(e.key)){
    const idx=+e.key-1;
    const btn=document.querySelector(`.opt[data-pos="${idx}"]`);
    if(btn) btn.click();
  }
});

render();
</script>
